version: 0.2

env:
  variables:
    TERM: "xterm-256color"
    TF_IN_AUTOMATION: "true"

phases:
  install:
    commands:
      - echo "Installing HashiCorp Terraform CLI v1.10.5..."
      - curl -sSL https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip -o terraform.zip
      - unzip -q terraform.zip
      - mv terraform /usr/local/bin/
      - terraform --version

  pre_build:
    commands:
      - echo "Initializing Terraform workspace and fetching registry module kishormore14/tfout/utility..."
      - terraform init

  build:
    commands:
      - echo "========================================================================="
      - echo "STAGE 1: APPLYING TERRAFORM INFRASTRUCTURE & DISPLAYING TFOUT BANNERS"
      - echo "========================================================================="
      - terraform apply -auto-approve -var="aws_profile="

  post_build:
    commands:
      - echo "========================================================================="
      - echo "STAGE 2: CLEANING UP INFRASTRUCTURE (TERRAFORM DESTROY)"
      - echo "========================================================================="
      - terraform destroy -auto-approve -var="aws_profile="
      - echo "Build test cycle completed: both Apply and Destroy executed successfully!"
