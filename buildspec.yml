version: 0.2

env:
  variables:
    TERM: "xterm-256color"
    TF_IN_AUTOMATION: "true"
    CLICOLOR_FORCE: "1"
    FORCE_COLOR: "1"

phases:
  install:
    commands:
      - echo "Installing HashiCorp Terraform CLI v1.10.5..."
      - curl -sSL https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip -o /tmp/terraform.zip
      - unzip -oq /tmp/terraform.zip -d /tmp
      - install /tmp/terraform /usr/local/bin/terraform
      - terraform --version

  pre_build:
    commands:
      - echo "Initializing Terraform workspace..."
      - terraform init -input=false

  build:
    commands:
      - echo "STAGE 1 - APPLYING TERRAFORM INFRASTRUCTURE"
      - terraform apply -auto-approve -color -input=false -var="aws_profile="

  post_build:
    commands:
      - echo "STAGE 2 - CLEANING UP INFRASTRUCTURE"
      - terraform destroy -auto-approve -color -input=false -var="aws_profile="
      - echo "Build test cycle completed successfully!"
