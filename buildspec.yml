  pre_build:
    commands:
      - echo "Initializing Terraform and downloading registry modules..."
      - terraform init -input=false

  build:
    commands:
      - |
        echo "========================================================================="
        echo "STAGE 1: APPLYING TERRAFORM INFRASTRUCTURE"
        echo "========================================================================="
      - terraform apply -auto-approve -input=false

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "========================================================================="
          echo "STAGE 2: DESTROYING TEST INFRASTRUCTURE"
          echo "========================================================================="
          terraform destroy -auto-approve -input=false
          echo "Build test cycle completed."
        else
          echo "Build failed. Skipping automatic destroy; inspect the resources and Terraform state."
          exit 1
        fi
